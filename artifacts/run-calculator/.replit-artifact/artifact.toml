kind = "web"
previewPath = "/"
title = "Production Run Calculator"
version = "1.0.0"
id = "artifacts/run-calculator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = ["/"]
localPort = 26038

[services.development]
run = "node ../../scripts/v2-preview-proxy.mjs"

[services.production]
build = ["bash", "scripts/build-v2-artifact-static.sh"]
publicDir = "artifacts/run-calculator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26038"
BASE_PATH = "/"
