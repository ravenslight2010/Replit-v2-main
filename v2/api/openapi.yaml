          type: [string, "null"]
          format: date
        expectedRevision:
          type: integer
          minimum: 0
        command:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, run]
              properties:
                type:
                  const: add
                run:
                  $ref: "#/components/schemas/PlannedScheduleRun"
            - type: object
              additionalProperties: false
              required: [type, runId, changes]
              properties:
                type:
                  const: update
                runId:
                  type: string
                  format: uuid
                changes:
                  type: object
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    productCode:
                      type: string
                    productionSetupCode:
                      type: string
                    runTemplateCode:
                      type: string
                    targetCases:
                      type: integer
                    notes:
                      type: string
            - type: object
              additionalProperties: false
              required: [type, runId]
              properties:
                type:
                  const: remove
                runId:
                  type: string
                  format: uuid
            - type: object
              additionalProperties: false
              required: [type, runId, toIndex]
              properties:
                type:
                  const: move
                runId:
                  type: string
                  format: uuid
                toIndex:
                  type: integer
                  minimum: 0
                  maximum: 99
            - type: object
              additionalProperties: false
              required: [type, firstRunId, secondRunId]
