          type: string
          enum: [accepted, conflict]
        replayed:
          type: boolean
        schedule:
          $ref: "#/components/schemas/ProductionSchedule"
    ScheduleWorkbookPreviewRequest:
      type: object
      additionalProperties: false
      required: [fileName, workbookBase64]
      properties:
        fileName:
          type: string
          maxLength: 500
        workbookBase64:
          type: string
          maxLength: 6990508
          contentEncoding: base64
    ScheduleWorkbookPreviewResponse:
      type: object
      required: [preview]
      properties:
        preview:
          type: object
          required: [rows, errors, skipped, multiDay, fileName]
          properties:
            rows:
              type: array
              maxItems: 2000
              items:
                type: object
                required: [rowNumber, sheet, date, brand, flavor, targetCases, notes, sourceCells, sourceRow, importRunId]
                properties:
                  rowNumber:
                    type: integer
                  sheet:
                    type: string
                  date:
                    type: [string, "null"]
                    format: date
                  brand:
                    type: string
                  flavor:
                    type: string
                  targetCases:
                    type: [integer, "null"]
                  notes:
                    type: string
                  sourceCells:
                    type: object
                  sourceRow:
                    type: integer
                  importRunId:
                    type: string
                    format: uuid
            errors:
              type: array
              items:
                $ref: "#/components/schemas/ScheduleWorkbookIssue"
            skipped:
              type: array
              items:
                $ref: "#/components/schemas/ScheduleWorkbookSkipped"
            multiDay:
              type: boolean
            fileName:
              type: string
    ScheduleWorkbookIssue:
      type: object
      required: [rowNumber, sheet, message]
      properties:
        rowNumber:
          type: integer
          minimum: 1
        sheet:
          type: string
          maxLength: 31
        date:
          type: string
          format: date
        message:
          type: string
          maxLength: 300
    ScheduleWorkbookSkipped:
      type: object
      required: [rowNumber, sheet, reason]
      properties:
        rowNumber:
          type: integer
          minimum: 1
        sheet:
          type: string
          maxLength: 31
        date:
          type: string
          format: date
        reason:
          type: string
          maxLength: 300
    Error:
      type: object
      required: [error]
