        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: saveReviewedDieDefaults
      summary: Create, revise, re-enable, or retire reviewed die defaults
      description: Manager-only. expectedRevision prevents stale writes; requestId makes retries idempotent.
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, dieCode, expectedRevision, defaults, enabled]
              properties:
                requestId:
                  type: string
                  minLength: 1
                  maxLength: 200
                dieCode:
                  type: string
                  pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
                expectedRevision:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                defaults:
                  $ref: "#/components/schemas/ReviewedDieLineSettings"
                enabled:
                  type: boolean
      responses:
