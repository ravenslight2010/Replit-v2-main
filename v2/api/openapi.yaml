        "200":
          description: Facility-scoped physical count summaries
          content:
            application/json:
              schema:
                type: object
                required: [counts]
                properties:
                  counts:
                    type: array
                    items:
                      $ref: "#/components/schemas/CycleCountSummary"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: stageInventoryCycleCount
      summary: Stage a partial physical count for fresh review
      description: Counts only submitted product codes; absolute values must be reviewed against current balance revisions before explicit acknowledgement and apply.
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CycleCountRequest"
      responses:
        "201":
          description: Count staged or marked stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleCountActionResult"
        "200":
          description: Previously staged count confirmed by retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleCountActionResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
  /api/v2/inventory/cycle-counts/{countId}:
    get:
      operationId: getInventoryCycleCount
      summary: Read cycle-count rows and their current status
      parameters:
        - $ref: "#/components/parameters/CountId"
      responses:
        "200":
          description: Count detail, including captured balance revisions and variances
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    $ref: "#/components/schemas/CycleCountRecord"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v2/inventory/cycle-counts/{countId}/review:
    post:
      operationId: reviewInventoryCycleCount
      summary: Review a cycle count against current stock revisions
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CountId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Review recorded or stale count fenced from application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleCountActionResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v2/inventory/cycle-counts/{countId}/apply:
    post:
      operationId: applyInventoryCycleCount
      summary: Apply a freshly reviewed absolute count after acknowledgement
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CountId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [acknowledged]
              properties:
                acknowledged:
                  const: true
      responses:
        "200":
          description: Absolute-count correction applied or confirmed by retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleCountActionResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v2/inventory/run-staged-supplies:
    get:
      operationId: listRunStagedSupplies
      summary: List staged substitutions for one run
      description: Available to run readers and inventory managers; returns no unrelated warehouse stock.
      parameters:
        - in: query
          name: runId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Run-scoped staged supply and completion receipts
          content:
            application/json:
              schema:
                type: object
                required: [supplies]
                properties:
                  supplies:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunStagedSupply"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: stageRunInventorySupply
      summary: Reserve an equivalent-unit stock substitute for a run
      description: The reservation is deducted only by the server's run-completion transaction; unused staged stock is released when the run completes.
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStagedSupplyRequest"
      responses:
        "201":
          description: Run supply reservation recorded or confirmed by retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStagedSupplyResult"
        "200":
          description: Previously recorded reservation confirmed by retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStagedSupplyResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v2/inventory/movements:
    get:
      operationId: listInventoryMovements
      summary: List stock movements for a warehouse
      parameters:
        - in: query
          name: warehouseId
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: beforeAt
          required: false
          schema:
            type: string
            format: date-time
          description: Timestamp from the last item on the previous page; provide with beforeId.
        - in: query
          name: beforeId
          required: false
          schema:
            type: string
            format: uuid
          description: Movement ID from the last item on the previous page; provide with beforeAt.
      responses:
        "200":
          description: Bounded page from the append-only warehouse movement ledger
          content:
            application/json:
              schema:
                type: object
                required: [movements, nextCursor]
                properties:
                  movements:
                    type: array
                    items:
                      $ref: "#/components/schemas/InventoryMovement"
                  nextCursor:
                    type: [object, "null"]
                    required: [occurredAt, id]
                    properties:
                      occurredAt:
                        type: string
                        format: date-time
                      id:
                        type: string
                        format: uuid
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: recordInventoryMovement
      summary: Receive or adjust stock in a warehouse
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryMovementRequest"
      responses:
        "200":
          description: Movement accepted or confirmed by retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMovementResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v2/inventory/transfers:
    post:
      operationId: transferInventory
      summary: Transfer stock between two warehouses
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryTransferRequest"
      responses:
        "200":
          description: Transfer accepted or confirmed by retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryTransferResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v2/inventory/opening-counts:
    get:
      operationId: listOpeningCounts
      summary: List recent physical counts for manager review
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Facility-scoped opening count summaries
          content:
            application/json:
              schema:
                type: object
                required: [counts]
                properties:
                  counts:
                    type: array
                    items:
                      $ref: "#/components/schemas/OpeningCountSummary"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: stageOpeningCount
      summary: Stage a physical opening count for review
      description: Every active product, including zero quantities, must be counted.
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpeningCountRequest"
      responses:
        "201":
          description: Count staged for manager review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpeningCount"
        "200":
          description: Previously staged count confirmed by retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpeningCount"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /api/v2/inventory/opening-counts/{countId}:
    get:
      operationId: getOpeningCount
      summary: Read a staged or applied opening count
      parameters:
        - $ref: "#/components/parameters/CountId"
      responses:
        "200":
          description: Count review and application state
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    $ref: "#/components/schemas/OpeningCountRecord"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v2/inventory/opening-counts/{countId}/review:
    post:
      operationId: reviewOpeningCount
      summary: Record manager review of an opening count
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CountId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpeningCountResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v2/inventory/opening-counts/{countId}/apply:
    post:
      operationId: applyOpeningCount
      summary: Apply a reviewed physical opening count
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CountId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Count applied or confirmed by retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpeningCountResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    v2Session:
      type: apiKey
      in: cookie
      name: v2_session
    v2CsrfCookie:
      type: apiKey
      in: cookie
      name: v2_csrf
  parameters:
    RunId:
      in: path
      name: runId
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      in: path
      name: importId
      required: true
      schema:
        type: string
        format: uuid
    CountId:
      in: path
      name: countId
      required: true
      schema:
        type: string
        format: uuid
    PasswordResetRequestId:
      in: path
      name: requestId
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          const: ok
        stationWorker:
          type: object
          required:
            - status
            - lastCycleAt
            - lastSuccessAt
            - consecutiveFailures
            - lastErrorName
            - processedLastCycle
          properties:
            status:
              type: string
              enum: [active, standby]
            lastCycleAt:
              type: [string, "null"]
              format: date-time
            lastSuccessAt:
              type: [string, "null"]
              format: date-time
            consecutiveFailures:
              type: integer
              minimum: 0
            lastErrorName:
              type: [string, "null"]
              pattern: "^[A-Za-z][A-Za-z0-9_]{0,79}$"
            processedLastCycle:
              type: integer
              minimum: 0
    AuthSignIn:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
        password:
          type: string
          minLength: 1
          maxLength: 128
    FirstManagerBootstrap:
      type: object
      additionalProperties: false
      required: [bootstrapCode, username, password]
      properties:
        bootstrapCode:
          type: string
          minLength: 32
          maxLength: 256
        username:
          type: string
          minLength: 3
          maxLength: 40
        password:
          type: string
          minLength: 6
          maxLength: 128
    StaffAccountCreate:
      type: object
      additionalProperties: false
      required: [username, password, roleName]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
        password:
          type: string
          minLength: 6
          maxLength: 128
        roleName:
          type: string
          minLength: 1
          maxLength: 80
    StaffAccountUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        disabled:
          type: boolean
        roleName:
          type: string
          minLength: 1
          maxLength: 80
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
    PasswordResetCompletion:
      type: object
      additionalProperties: false
      required: [username, code, newPassword]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
        code:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        newPassword:
          type: string
          minLength: 6
          maxLength: 128
    PasswordResetDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, deny]
    PasswordResetQueue:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PasswordResetRequestSummary"
    PasswordResetRequestSummary:
      type: object
      required: [requestId, staffId, username, state, requestedAt, decidedAt, codeExpiresAt]
      properties:
        requestId:
          type: string
          format: uuid
        staffId:
          type: string
          format: uuid
        username:
          type: string
        state:
          type: string
          enum: [pending, approved]
        requestedAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, "null"]
          format: date-time
        codeExpiresAt:
          type: [string, "null"]
          format: date-time
    PasswordResetApproved:
      type: object
      required: [outcome, code, expiresAt]
      properties:
        outcome:
          const: approved
        code:
          type: string
          minLength: 43
          maxLength: 43
        expiresAt:
          type: string
          format: date-time
    PasswordResetReissued:
      type: object
      required: [outcome, code, expiresAt]
      properties:
        outcome:
          const: reissued
        code:
          type: string
          minLength: 43
          maxLength: 43
        expiresAt:
          type: string
          format: date-time
    PasswordResetDenied:
      type: object
      required: [outcome]
      properties:
        outcome:
          const: denied
    StaffDirectory:
      type: object
      required: [staff, roles]
      properties:
        staff:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/StaffAccount"
        roles:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/StaffRole"
    StaffAccount:
      type: object
      required: [userId, username, role, disabled, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
        disabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    StaffRole:
      type: object
      required: [name, capabilities]
      properties:
        name:
          type: string
        capabilities:
          type: array
          items:
            type: string
    AuthSession:
      type: object
      required: [staff, expiresAt]
      properties:
        staff:
          $ref: "#/components/schemas/Staff"
        expiresAt:
          type: string
          format: date-time
    Staff:
      type: object
      required: [userId, username, role, capabilities]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
        capabilities:
          type: array
          items:
            type: string
    RunSetup:
      type: object
      additionalProperties: false
      required: [label, targetCases]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        targetCases:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        productCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
          description: Stable link to the active V2 product selected when the run is created.
        productionSetupCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
          description: Stable link to the compatible imported production setup.
        productionPlan:
          $ref: "#/components/schemas/ProductionPlanSnapshot"
        dieSetup:
          $ref: "#/components/schemas/RunDieSetupSnapshot"
    RunCreateSetup:
      type: object
      additionalProperties: false
      required: [label, targetCases, productCode, productionSetupCode]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        targetCases:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        productCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        productionSetupCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        dieSetup:
          $ref: "#/components/schemas/RunDieSetupInput"
    RunDieSetupInput:
      type: object
      additionalProperties: false
      required: [dieTypeCode, expectedRevision, lineSettings]
      properties:
        dieTypeCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        lineSettings:
          $ref: "#/components/schemas/DieLineSettings"
    RunDieSetupSnapshot:
      type: object
      additionalProperties: false
      required: [dieTypeCode, dieTypeName, defaultStatus, defaultRevision, lineSettings]
      properties:
        dieTypeCode:
          type: string
        dieTypeName:
          type: string
        defaultStatus:
          type: string
          enum: [active, disabled, unreviewed]
        defaultRevision:
          type: integer
          minimum: 0
        lineSettings:
          $ref: "#/components/schemas/DieLineSettings"
    DieLineSettings:
      type: object
      additionalProperties: false
      required: [crustsPerCycle, cycleSpeed, speedAdjustment, freezerTime, casesPerLayer, preTunnelMin, postTunnelMin, pressOvenMin, frontlineMin]
      properties:
        crustsPerCycle:
          type: [number, "null"]
          minimum: 0
        cycleSpeed:
          type: [number, "null"]
          minimum: 0
        speedAdjustment:
          type: [number, "null"]
          minimum: 0
        freezerTime:
          type: [number, "null"]
          minimum: 0
        casesPerLayer:
          type: [number, "null"]
          minimum: 0
        preTunnelMin:
          type: [number, "null"]
          minimum: 0
        postTunnelMin:
          type: [number, "null"]
          minimum: 0
        pressOvenMin:
          type: [number, "null"]
          minimum: 0
        frontlineMin:
          type: [number, "null"]
          minimum: 0
    ReviewedDieLineSettings:
      type: object
      additionalProperties: false
      required: [crustsPerCycle, cycleSpeed, speedAdjustment, freezerTime, casesPerLayer, preTunnelMin, postTunnelMin, pressOvenMin, frontlineMin]
      properties:
        crustsPerCycle:
          type: number
          minimum: 0
        cycleSpeed:
          type: number
          minimum: 0
        speedAdjustment:
          type: number
          minimum: 0
        freezerTime:
          type: number
          minimum: 0
        casesPerLayer:
          type: number
          minimum: 0
        preTunnelMin:
          type: [number, "null"]
          minimum: 0
        postTunnelMin:
          type: [number, "null"]
          minimum: 0
        pressOvenMin:
          type: [number, "null"]
          minimum: 0
        frontlineMin:
          type: [number, "null"]
          minimum: 0
    ReviewedDieDefault:
      type: object
      required: [code, name, status, revision, defaults, suggestedDefaults]
      properties:
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, disabled, unreviewed]
        revision:
          type: integer
          minimum: 0
        defaults:
          oneOf:
            - $ref: "#/components/schemas/ReviewedDieLineSettings"
            - type: "null"
        suggestedDefaults:
          oneOf:
            - $ref: "#/components/schemas/ReviewedDieLineSettings"
            - type: "null"
    RunDieType:
      $ref: "#/components/schemas/ReviewedDieDefault"
    DieDefaultSaveResult:
      type: object
      required: [outcome, dieCode, revision, status, defaults, replayed]
      properties:
        outcome:
          type: string
          enum: [created, updated, retired, re-enabled]
        dieCode:
          type: string
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, disabled]
        defaults:
          $ref: "#/components/schemas/ReviewedDieLineSettings"
        replayed:
          type: boolean
    DieDefaultHistoryItem:
      type: object
      required: [id, dieCode, actorId, action, revision, before, after, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        dieCode:
          type: string
        actorId:
          type: string
          format: uuid
        action:
          type: string
          enum: [created, updated, retired, re-enabled]
        revision:
          type: integer
          minimum: 1
        before:
          oneOf:
            - type: object
            - type: "null"
        after:
          type: object
        occurredAt:
          type: string
          format: date-time
    DoughCapacity:
      type: object
      required: [status, reasons, doughballYield, pizzasPerCase]
      properties:
        status:
          type: string
          enum: [available, unavailable]
        reasons:
          type: array
          items:
            type: string
        doughballYield:
          type: [number, "null"]
          minimum: 0
        pizzasPerCase:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
    RunProduct:
      type: object
      required: [code, name, doughCapacity, productionSetups]
      properties:
        code:
          type: string
        name:
          type: string
        doughCapacity:
          $ref: "#/components/schemas/DoughCapacity"
        productionSetups:
          type: array
          items:
            $ref: "#/components/schemas/ProductionSetupOption"
    ProductionSetupOption:
      type: object
      required: [code, name, hasDoughRecipe]
      properties:
        code:
          type: string
        name:
          type: string
        hasDoughRecipe:
          type: boolean
    ProductionWarehouse:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ProductionPlanLine:
      type: object
      required: [productId, productCode, productName, unit, quantity]
      properties:
        productId:
          type: string
          format: uuid
        productCode:
          type: string
        productName:
          type: string
        unit:
          type: string
        quantity:
          type: string
          pattern: "^(0|[1-9][0-9]{0,11})(\\.[0-9]{1,6})?$"
    ProductionRecipeSnapshot:
      type: object
      required: [code, name, stationKey, ingredients]
      properties:
        code:
          type: string
        name:
          type: string
        stationKey:
          type: string
          enum: [dough, cheese, pepperoni, sauce, frontline]
        ingredients:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProductionPlanLine"
    ProductionPlanSnapshot:
      type: object
      required: [code, name, warehouse, recipes, packagingPerCase]
      properties:
        code:
          type: string
        name:
          type: string
        warehouse:
          $ref: "#/components/schemas/ProductionWarehouse"
        recipes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProductionRecipeSnapshot"
        packagingPerCase:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProductionPlanLine"
    InventoryConsumptionLine:
      type: object
      required: [productId, productCode, productName, unit, required, deducted, shortfall]
      properties:
        productId:
          type: string
          format: uuid
        productCode:
          type: string
        productName:
          type: string
        unit:
          type: string
        required:
          type: string
        deducted:
          type: string
        shortfall:
          type: string
    RunInventoryConsumption:
      type: object
      required: [status, runId, warehouseId, warehouseName, lines, occurredAt]
      properties:
        status:
          type: string
          enum: [completed]
        runId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        warehouseName:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InventoryConsumptionLine"
        occurredAt:
          type: string
          format: date-time
    PauseInterval:
      type: object
      required: [startedAt, endedAt]
      properties:
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, "null"]
          format: date-time
    Run:
      type: object
      description: >
        Server-owned run snapshot. Optional productionRules contains enabled
        manager-imported rule assessments. Unknown is not a pass. Flexible
        findings warn; strict unknown/violated findings block preparation/start.
        A bypass can only come from the reviewed imported rule configuration.
      required:
        - id
        - status
        - revision
        - createdAt
        - updatedAt
        - startedAt
        - pausedAt
        - resumedAt
        - completedAt
        - serverNow
        - setupSnapshot
        - doughCapacity
        - inventoryConsumption
        - pauseIntervals
        - stationProgress
      properties:
        productionRules:
          type: array
          items:
            type: object
            required: [code, name, enforcement, status, sourceImportId]
            properties:
              code:
                type: string
              name:
                type: string
              enforcement:
                type: string
                enum: [flexible, strict]
              status:
                type: string
                enum: [passed, violated, unknown, bypassed]
              sourceImportId:
                type: string
                format: uuid
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [planned, running, paused, completed]
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        pausedAt:
          type: [string, "null"]
          format: date-time
        resumedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        serverNow:
          type: string
          format: date-time
        setupSnapshot:
          $ref: "#/components/schemas/RunSetup"
        doughCapacity:
          $ref: "#/components/schemas/DoughCapacity"
        inventoryConsumption:
          oneOf:
            - $ref: "#/components/schemas/RunInventoryConsumption"
            - type: "null"
        pauseIntervals:
          type: array
          items:
            $ref: "#/components/schemas/PauseInterval"
        stationProgress:
          type: object
          description: Canonical per-station inputs, progress, timer state, and revisions.
          additionalProperties:
            $ref: "#/components/schemas/StationState"
    StationState:
      type: object
      required: [status, revision, inputs, progress, startedAt, pausedAt, completedAt, nextDueAt, updatedAt]
      properties:
        status:
          type: string
          enum: [not_started, running, paused, completed]
        revision:
          type: integer
          minimum: 0
        inputs:
          type: object
          additionalProperties:
            type: number
        progress:
          type: object
          description: Validated station counters and server-owned timer/auto-track anchors.
        startedAt:
          type: [string, "null"]
          format: date-time
        pausedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        nextDueAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StationCommand:
      type: object
      additionalProperties: false
      required: [commandId, expectedRevision, mode, changes]
      properties:
        commandId:
          type: string
          minLength: 1
          maxLength: 200
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        mode:
          type: string
          enum: [manual, auto_track, timer_start, timer_pause, timer_resume, timer_reset]
        changes:
          type: object
          description: Station-specific numeric setup or progress fields. Automatic/timer modes require an empty object.
          additionalProperties:
            type: number
            minimum: 0
    StationCommandAccepted:
      type: object
      required: [outcome, replayed, commandId, stationKey, run]
      properties:
        outcome:
          const: accepted
        replayed:
          type: boolean
        commandId:
          type: string
        stationKey:
          type: string
        run:
          $ref: "#/components/schemas/Run"
    StationCommandNoChange:
      type: object
      required: [outcome, currentRun]
      properties:
        outcome:
          type: string
          enum: [not_due, not_enabled]
        currentRun:
          $ref: "#/components/schemas/Run"
    StationCommandConflict:
      type: object
      required: [outcome, currentRun]
      properties:
        outcome:
          type: string
          enum: [conflict, invalid_transition]
        expectedRevision:
          type: integer
        currentRun:
          $ref: "#/components/schemas/Run"
    RunCreated:
      type: object
      required: [outcome, replayed, run]
      properties:
        outcome:
          const: created
        replayed:
          type: boolean
        run:
          $ref: "#/components/schemas/Run"
    RunCommandAccepted:
      type: object
      required: [outcome, replayed, commandId, run]
      properties:
        outcome:
          const: accepted
        replayed:
          type: boolean
        commandId:
          type: string
        run:
          $ref: "#/components/schemas/Run"
    RunConflict:
      type: object
      required: [outcome, expectedRevision, currentRun]
      properties:
        outcome:
          const: conflict
        expectedRevision:
          type: integer
        currentRun:
          $ref: "#/components/schemas/Run"
    InvalidTransition:
      type: object
      required: [outcome, currentStatus]
      properties:
        outcome:
          const: invalid_transition
        currentStatus:
          type: string
          enum: [planned, running, paused, completed]
    SetupImportRequest:
      type: object
      additionalProperties: false
      required: [requestId, kind, csv]
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum: [products, recipes, production-setups]
        csv:
          type: string
          maxLength: 1048576
    SetupCatalogRequest:
      type: object
      additionalProperties: false
      required: [requestId, family, csv]
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 200
        family:
          type: string
          enum:
            - ingredients
            - mixes
            - die-types
            - die-line-defaults
            - production-rules
            - freezer-pull-items
            - run-templates
            - manager-lists
            - aliases
        csv:
          type: string
          maxLength: 1048576
          description: Strict family-specific CSV with a maximum of 2,000 data rows.
        sourceSummary:
          $ref: "#/components/schemas/SourceImportSummary"
    SourceWorkbookPreviewRequest:
      type: object
      additionalProperties: false
      required: [family, fileName, workbookBase64]
      properties:
        family:
          type: string
          enum: [spec-sheets, premix-sheets, cheese-mix-specs, shipping-guides, sauce-guides, dough-guides]
        fileName:
          type: string
          minLength: 1
          maxLength: 180
        workbookBase64:
          type: string
          maxLength: 6990508
          contentEncoding: base64
          description: XLSX bytes, or DOCX bytes for sauce guides; maximum 5 MiB.
    SourceWorkbookPreviewResponse:
      type: object
      required: [family, targetFamily, parserVersion, fileSha256, sourceRows, proposedRows, skippedRows, unresolvedRows, records]
      properties:
        family:
          type: string
          enum: [spec-sheets, premix-sheets, cheese-mix-specs, shipping-guides, sauce-guides, dough-guides]
        targetFamily:
          type: string
          enum: [mixes, run-templates]
        parserVersion:
          type: string
          const: v1-source-import/1
        fileSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        sourceRows:
          type: integer
          minimum: 0
          maximum: 2000
          description: Parser-counted physical rows; a row can fan out to flavors or several rows can group into one record.
        proposedRows:
          type: integer
          minimum: 0
          maximum: 2000
        skippedRows:
          type: integer
          minimum: 0
          maximum: 2000
        unresolvedRows:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/SourceImportUnresolved"
        records:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/SourceWorkbookPreviewRecord"
    SourceImportUnresolved:
      type: object
      additionalProperties: false
      required: [source, reason]
      properties:
        source:
          type: string
          maxLength: 240
        reason:
          type: string
          maxLength: 300
    SourceWorkbookPreviewRecord:
      type: object
      additionalProperties: false
      required: [source, targetFamily, record]
      properties:
        source:
          type: string
          maxLength: 240
        targetFamily:
          type: string
          enum: [mixes, run-templates]
        record:
          $ref: "#/components/schemas/SetupCatalogRecord"
        sourceDetails:
          type: object
          description: Transient parsed evidence for manager correction; not stored after staging.
          additionalProperties: true
    SourceImportSummary:
      type: object
      additionalProperties: false
      required: [sourceFamily, sourceSha256, parserVersion, sourceRows, importedRows, skippedRows, unresolvedRows]
      properties:
        sourceFamily:
          type: string
          enum: [spec-sheets, premix-sheets, cheese-mix-specs, shipping-guides, sauce-guides, dough-guides]
        sourceSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        parserVersion:
          type: string
          const: v1-source-import/1
        sourceRows:
          type: integer
          minimum: 0
          maximum: 2000
          description: Parser-counted physical rows; a row can fan out to flavors or several rows can group into one record.
        importedRows:
          type: integer
          minimum: 1
          maximum: 2000
          description: Reviewed V2 records staged; Apply separately reports created and updated targets.
        skippedRows:
          type: integer
          minimum: 0
          maximum: 2000
          description: Rows or candidates omitted by parser rules or explicitly skipped during review.
        unresolvedRows:
          type: integer
          minimum: 0
          maximum: 2000
          description: Unresolved review-only entries left open after staging.
    SetupCatalogRecord:
      type: object
      additionalProperties: false
      required: [code, name, data]
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$"
        name:
          type: string
          minLength: 1
          maxLength: 200
        data:
          type: object
