openapi: 3.1.0
info:
  title: V2 Run Control API
  version: 0.1.0
  description: >
    Facility-scoped run control. The host must authenticate staff, enforce
    permissions, and validate same-origin/CSRF protection before mutations.
servers:
  - url: /
security:
  - v2Session: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Check API and V2 database availability
      security: []
      responses:
        "200":
          description: API and station worker can serve requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database or station worker is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in with a V2 staff account
      description: >
        Creates a fresh V2-only session. The server sets an HttpOnly session
        cookie and a separate readable CSRF cookie; credentials and tokens are
        never returned in the response body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSignIn"
      responses:
        "200":
          description: Sign-in accepted; session and CSRF cookies are set
          headers:
            Set-Cookie:
              description: Separate v2_session and v2_csrf cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/session:
    get:
      operationId: getSession
      summary: Read the current V2 staff session
      responses:
        "200":
          description: Public staff identity and session expiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/bootstrap-status:
    get:
      operationId: getFirstManagerSetupStatus
      summary: Check whether guarded V2 setup is available
      description: >
        Setup is available only while a V2 bootstrap secret is configured, no
        staff account exists, and the durable one-time bootstrap marker is
        unset. The response never contains the secret or any account credential.
      security: []
      responses:
        "200":
          description: One-time first-manager setup status
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/bootstrap:
    post:
      operationId: bootstrapFirstManager
      summary: Create the first V2 manager once
      description: >
        Requires the server-configured one-time V2 bootstrap code and an empty
        V2 staff-account table. The server sets session and CSRF cookies;
        passwords, bootstrap codes, and session tokens are not returned in the
        response body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirstManagerBootstrap"
      responses:
        "201":
          description: First manager created and signed in
          headers:
            Set-Cookie:
              description: Separate V2 session and CSRF cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/sign-out:
    post:
      operationId: signOut
      summary: Revoke the current V2 staff session
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked or already absent; V2 auth cookies cleared
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/staff:
    get:
      operationId: listStaffAccounts
      summary: List V2 staff accounts and assignable roles
      responses:
        "200":
          description: Bounded staff directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDirectory"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
    post:
      operationId: createStaffAccount
      summary: Create a V2 staff account
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffAccountCreate"
      responses:
        "201":
          description: Staff account created; no credential is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDirectory"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/staff/{staffId}:
    patch:
      operationId: updateStaffAccount
      summary: Disable a staff account or change its role
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - name: staffId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffAccountUpdate"
      responses:
        "200":
          description: Staff account updated; affected sessions are revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffDirectory"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/password-reset-requests:
    get:
      operationId: listStaffPasswordResetRequests
      summary: List active password recovery requests for an authorized manager
      security:
        - v2Session: []
      responses:
        "200":
          description: Bounded pending requests and approved codes available for reissue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetQueue"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
    post:
      operationId: requestStaffPasswordReset
      summary: Request password recovery without confirming account existence
      description: >
        Always returns the same accepted response for valid usernames. The
        server stores no recovery code until a manager approves a known active
        account; the request itself revokes that account's existing sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Recovery request accepted without revealing whether the account exists
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    const: true
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/password-reset-requests/{requestId}/decision:
    post:
      operationId: decideStaffPasswordReset
      summary: Approve or deny a password recovery request
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/PasswordResetRequestId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetDecision"
      responses:
        "200":
          description: Decision recorded; an approved code is shown only in this authorized response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PasswordResetApproved"
                  - $ref: "#/components/schemas/PasswordResetDenied"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/password-reset-requests/{requestId}/reissue:
    post:
      operationId: reissueStaffPasswordResetCode
      summary: Replace a lost or expired password recovery code
      description: >
        Replaces the active code and revokes any existing sessions. The prior
        code immediately becomes unusable. Codes are never returned by queue
        reads or ordinary account responses.
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/PasswordResetRequestId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: A new one-use code, shown once to an authorized manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetReissued"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/auth/password-reset-completions:
    post:
      operationId: completeStaffPasswordReset
      summary: Set a new password using a one-use recovery code
      description: >
        The recovery code is single-use and expires after ten minutes. A
        successful reset revokes every session and requires a fresh sign-in.
        Unknown usernames, disabled accounts, expired codes, and invalid codes
        receive the same safe failure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCompletion"
      responses:
        "204":
          description: Password replaced; all sessions revoked; a fresh sign-in is required
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/runs:
    get:
      operationId: listRuns
      summary: List runs for the authenticated facility
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Facility-scoped run list
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
    post:
      operationId: createRun
      summary: Create a planned run
      security:
        - v2Session: []
          v2CsrfCookie: []
      description: >
        New runs require an active imported product. requestId is an idempotency
        key. Repeating the same request returns the original run; reusing the
        key for different details returns 409.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, setupSnapshot]
              properties:
                requestId:
                  type: string
                  format: uuid
                setupSnapshot:
                  $ref: "#/components/schemas/RunCreateSetup"
      responses:
        "201":
          description: New planned run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreated"
        "200":
          description: Previously created run confirmed by idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCreated"
        "422":
          description: Enabled strict imported production rules block preparation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/schedules/catalog:
    get:
      operationId: getScheduleCatalog
      summary: Read products, setup choices, and run templates for planning
      description: Requires the manager capability used to manage factory settings. Recipe details and live run state are not included in template estimate values.
      responses:
        "200":
          description: Schedule planning choices and Central production start time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleCatalog"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/schedules:
    get:
      operationId: getProductionSchedule
      summary: Read one facility schedule by production date
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Canonical date-scoped plan and server revision
          content:
            application/json:
              schema:
                type: object
                required: [schedule]
                properties:
                  schedule:
                    $ref: "#/components/schemas/ProductionSchedule"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/schedules/commands:
    post:
      operationId: applyProductionScheduleCommand
      summary: Apply one revision-checked schedule change
      description: >
        Commands are idempotent per manager and requestId. A stale revision
        returns 409 with the latest canonical date plan. Planned schedule
        entries never create or update live run records.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionScheduleCommandRequest"
      responses:
        "200":
          description: Accepted change or exact retry; contains canonical schedule state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionScheduleCommandResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: Stale revision or unavailable planned-run reference; latest schedule is returned when revision conflicts
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProductionScheduleCommandResponse"
                  - $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/schedules/import-preview:
    post:
      operationId: previewProductionScheduleWorkbook
      summary: Review a V1 schedule workbook without applying it
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleWorkbookPreviewRequest"
      responses:
        "200":
          description: Reviewed rows, skipped entries, and validation issues; no schedule data is changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleWorkbookPreviewResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/runs/products:
    get:
      operationId: listRunProducts
      summary: List active products, applicable dies, and the production warehouse
      responses:
        "200":
          description: Active products, compatible production setups, and the current production warehouse
          content:
            application/json:
              schema:
                type: object
                required: [products, productionWarehouse, dieTypes]
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunProduct"
                  productionWarehouse:
                    oneOf:
                      - $ref: "#/components/schemas/ProductionWarehouse"
                      - type: "null"
                  dieTypes:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunDieType"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/runs/{runId}:
    get:
      operationId: getRun
      summary: Read one run from the authenticated facility
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Canonical run state
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run:
                    $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/runs/{runId}/commands:
    post:
      operationId: applyRunCommand
      summary: Apply a revision-guarded run lifecycle command
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [commandId, commandType, expectedRevision]
              properties:
                commandId:
                  type: string
                  minLength: 1
                  maxLength: 200
                commandType:
                  type: string
                  enum: [start, pause, resume, complete]
                expectedRevision:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
      responses:
        "200":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCommandAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Stale revision or invalid transition; includes canonical state
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RunConflict"
                  - $ref: "#/components/schemas/InvalidTransition"
        "422":
          description: Enabled strict imported production rules block starting this run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
  /api/v2/runs/{runId}/stations/{stationKey}/commands:
    post:
      operationId: applyRunStationCommand
      summary: Save or advance canonical production-station state
      security:
        - v2Session: []
          v2CsrfCookie: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/CsrfToken"
        - in: path
          name: stationKey
          required: true
          schema:
            type: string
            enum: [line, dough, cheese, pepperoni, sauce, frontline, packaging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
